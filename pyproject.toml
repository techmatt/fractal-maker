[project]
name = "fractal-maker-ml"
version = "0.1.0"
description = "Python ML tooling for the fractal-maker aesthetic classifier (finetune stage of the generate→present→label→finetune→bias loop)."
requires-python = ">=3.12,<3.14"
dependencies = [
    # Pinned to the versions already in uv's global cache (from C:\Code\video-to-photo)
    # so `uv sync` hardlinks the cu124 torch wheels instead of re-downloading them.
    "torch==2.6.0",
    "torchvision==0.21.0",
    "timm==1.0.27",
    "scikit-learn==1.8.0",
    "Pillow==12.2.0",
    "numpy",
    "matplotlib>=3.11.0",
    "flask>=3.1.3",
    "anthropic>=0.116.0",
]

# torch/torchvision are pulled from the PyTorch CUDA index below (cu124 build),
# not PyPI's default CPU build. Mirrors the video-to-photo setup.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The suite's extent, stated rather than emergent. Without this a bare `pytest`
# collects from the CWD downward, so what runs depends on where you invoked it.
# These five dirs are the complete set of locations holding tracked test files
# (verified 2026-07-31: `git ls-files | grep -E '(^|/)(test_[^/]*\.py|[^/]*_test\.py|conftest\.py)$'`
# → tools 64, tests 7, classifier 2, palette_lib 1, palette_extractor 1).
# Python tests are co-located with their code; `tests/` additionally holds the Rust
# integration tests (`tests/*.rs`), which cargo requires there and pytest ignores.
testpaths = ["tests", "tools", "classifier", "palette_lib", "palette_extractor"]
markers = [
    # Opt-in slow tests (e.g. the guard 81-set re-render tripwire, which renders 81
    # tiles through the live f64 field path). Exclude with: pytest -m "not slow".
    "slow: renders/heavy; opt-in, excluded by -m 'not slow'",
]
