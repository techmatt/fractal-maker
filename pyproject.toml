[project]
name = "fractal-maker-ml"
version = "0.1.0"
description = "Python ML tooling for the fractal-maker aesthetic classifier (finetune stage of the generate→present→label→finetune→bias loop)."
requires-python = ">=3.12,<3.14"
dependencies = [
    # Pinned to the versions already in uv's global cache (from C:\Code\video-to-photo)
    # so `uv sync` hardlinks the cu124 torch wheels instead of re-downloading them.
    "torch==2.6.0",
    "torchvision==0.21.0",
    "timm==1.0.27",
    "scikit-learn==1.8.0",
    "Pillow==12.2.0",
    "numpy",
    "matplotlib>=3.11.0",
    "flask>=3.1.3",
    "anthropic>=0.116.0",
    # mpmath picks gmpy2 up automatically when present (mpmath.libmp.BACKEND flips
    # 'python' -> 'gmpy'), which is a 1.48x speedup on the dps=60 Newton solves that the
    # roster/nucleus derivations and their parity tests are made of. Results are unchanged:
    # 208/208 solves verified bit-identical across the two backends on
    # (converged, iters, c, residual), 2026-08-08. Nothing imports gmpy2 directly.
    "gmpy2>=2.3.1",
]

# torch/torchvision are pulled from the PyTorch CUDA index below (cu124 build),
# not PyPI's default CPU build. Mirrors the video-to-photo setup.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
# The suite's extent, stated rather than emergent. Without this a bare `pytest`
# collects from the CWD downward, so what runs depends on where you invoked it.
# These five dirs are the complete set of locations holding tracked test files
# (verified 2026-07-31: `git ls-files | grep -E '(^|/)(test_[^/]*\.py|[^/]*_test\.py|conftest\.py)$'`
# → tools 64, tests 7, classifier 2, palette_lib 1, palette_extractor 1).
# Python tests are co-located with their code; `tests/` additionally holds the Rust
# integration tests (`tests/*.rs`), which cargo requires there and pytest ignores.
testpaths = ["tests", "tools", "classifier", "palette_lib", "palette_extractor"]
markers = [
    # Opt-in slow tests (e.g. the guard 81-set re-render tripwire, which renders 81
    # tiles through the live f64 field path). Run them with: pytest -m slow.
    "slow: renders/heavy; opt-in, excluded from the default lane by addopts",
    # NOT a lane — a LABEL, and it is excluded from nothing. These tests run every time.
    # It exists so the set of things a classifier-version flip must touch can be LISTED:
    #   uv run pytest -m version_pinned --collect-only -q
    # Before this marker, "what does flipping ACTIVE_CKPT break?" was answerable only by
    # flipping it and reading the failures — the v10 flip produced nine, three of which
    # were tests that hardcoded the old version and went red FOR the flip, not for a
    # fault. Eight files reference the pin; only the marked ones are flip-coupled, and
    # that distinction had no expression until now. Mark a test if it would need editing
    # (or would legitimately fail) when ACTIVE_CKPT moves.
    "version_pinned: coupled to production_pins.ACTIVE_CKPT; list before a flip",
    # The same label for the TWO STAGE-2 HEADS, and it is a separate marker rather than a
    # widening of the one above because the three pins move independently: the 2026-08-11
    # flip (prompts/flip_29.md) moved `wallpaper_pins.HEAD_CKPT_REL` and
    # `mining_pins.ACTIVE_MINING_CKPT` while `ACTIVE_CKPT` stayed on v11, so listing
    # `version_pinned` before it would have listed the wrong set. It went red in ten places
    # across six files, every one of them a test that had hardcoded an outgoing value — the
    # exact failure `version_pinned` exists to prevent, on the pins it does not cover.
    #   uv run pytest -m stage2_pinned --collect-only -q
    # Mark a test if it would need editing (or would legitimately fail) when either stage-2
    # head pin, its gate, its pool floor, or its suggestion cuts move.
    "stage2_pinned: coupled to wallpaper_pins / mining_pins; list before a stage-2 flip",
]
# `slow` was described as opt-in in this file and in every marked module's docstring,
# but nothing implemented it, so a bare `pytest` ran the whole opt-in lane anyway —
# 49s of the 172s suite, 46s of it the guard tripwire's 81 renders. This is the
# exclusion those docstrings already assumed. Note it is a FILTER, not a path rule:
# naming a slow test's file on the command line still deselects it, so the opt-in
# lane needs an explicit `-m slow` (see CLAUDE.md "Commands").
addopts = ["-m", "not slow"]
