<!doctype html><html><head><meta charset="utf-8"><title>label sheet</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{font:13px/1.5 ui-monospace,Consolas,monospace;background:#0e0f13;color:#ccc;margin:0;padding:0}
header{position:sticky;top:0;background:#12141a;border-bottom:1px solid #23252e;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;z-index:5}
h1{font-size:15px;margin:0;color:#eee}
.batch{color:#7a9; font-size:12px}
.spacer{flex:1}
button{font:inherit;background:#1c1f29;color:#ccc;border:1px solid #2c2f3a;border-radius:5px;padding:5px 10px;cursor:pointer}
button:hover{background:#262a36}
.counts{color:#888;font-size:12px}
.counts b{color:#cdd}
.bad{color:#e06a6a}.mid{color:#e0b24a}.good{color:#5ec07a}.exc{color:#6ab0e0}
main{display:flex;gap:18px;padding:18px;align-items:flex-start}
#stage{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px}
#stage img{width:100%;height:auto;max-height:86vh;object-fit:contain;border:1px solid #23252e;border-radius:6px;background:#000}
.meta{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;color:#777;font-size:11px}
.meta .cap{border:1px solid #23252e;border-radius:4px;padding:1px 7px}
.cur-score{font-size:12px}
.score-btns{display:flex;gap:10px;margin-top:2px}
.score-btns button{font-size:15px;padding:8px 18px}
.sb1{border-color:#5a2c2c}.sb2{border-color:#5a4a2c}.sb3{border-color:#2c5a3a}.sb4{border-color:#2c465a}
aside{width:340px;flex:none;max-height:86vh;overflow:auto;border:1px solid #1c1f29;border-radius:6px;padding:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cell{position:relative;border:2px solid transparent;border-radius:3px;cursor:pointer;aspect-ratio:16/9;background:#000;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell.cur{border-color:#6a8fd0}
.cell .tag{position:absolute;right:1px;bottom:0;font-size:10px;padding:0 3px;border-radius:2px;background:rgba(0,0,0,.6)}
.cell.s1 .tag{color:#e06a6a}.cell.s2 .tag{color:#e0b24a}.cell.s3 .tag{color:#5ec07a}.cell.s4 .tag{color:#6ab0e0}
.cell.s1{border-color:#5a2c2c}.cell.s2{border-color:#5a4a2c}.cell.s3{border-color:#2c5a3a}.cell.s4{border-color:#2c465a}
.cell.locstart{margin-left:0;box-shadow:-3px 0 0 0 #3a3f4d}
.hint{color:#777;font-size:11px;max-width:560px;text-align:center}
/* --- correction mode: a SUGGESTION is dim + dashed; a human decision is solid --- */
.sugg{color:#8a7}
.cur-score.pending{color:#8a7}
.score-btns button.suggested{box-shadow:inset 0 0 0 1px #8a7}
.cell.sug1,.cell.sug2,.cell.sug3,.cell.sug4{border-style:dashed;border-color:#3a4038}
.cell.sug1 .tag,.cell.sug2 .tag,.cell.sug3 .tag,.cell.sug4 .tag{color:#6d7a68}
#bulk{border-color:#4a3a2c}
#stage img{cursor:zoom-in}
#loader{padding:30px;max-width:680px}
input[type=file]{font:inherit}
code{color:#9bb}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;flex-direction:column;gap:10px}
#lightbox img{max-width:96vw;max-height:88vh;border:1px solid #333}
#lightbox .lbcap{color:#aaa;font-size:12px;text-align:center;max-width:90vw}
</style></head><body>
<header>
  <h1 id="page-title">wallpaper label</h1>
  <span class="batch" id="batch-label"></span>
  <span class="counts" id="counts"></span>
  <span class="spacer"></span>
  <button id="next-unscored">next unlabeled (u)</button>
  <button id="bulk" style="display:none">accept all remaining suggestions</button>
  <button id="bulk-below" style="display:none">accept all below this row</button>
  <button id="reset" style="display:none">clear my labels</button>
  <button id="export">export scores.json</button>
  <label class="cap" style="cursor:pointer;color:#ccc">load scores<input id="load-scores" type="file" accept=".json" hidden></label>
</header>

<div id="loader">
  <p>Loading <code id="images-url"></code> …</p>
  <p class="hint" id="loader-msg"></p>
  <p>If it didn't load (opened via <code>file://</code> with fetch blocked), pick the batch's <code>images.jsonl</code> manually:</p>
  <input id="load-images" type="file" accept=".jsonl,.json">
</div>

<main id="app" style="display:none">
  <div id="stage">
    <img id="cur-img" alt="">
    <div class="meta">
      <span class="cap" id="cap-loc"></span>
      <span class="cap" id="cap-fam"></span>
      <span class="cap" id="cap-pal"></span>
      <span class="cap" id="cap-params"></span>
      <span class="cap" id="cap-prefv2"></span>
      <span class="cap" id="cap-headv2"></span>
      <span class="cap sugg" id="cap-sugg"></span>
      <span class="cur-score" id="cur-score"></span>
    </div>
    <!-- built from TIERS at init: a K=3 corpus must not show a 4th button that its merge
         would refuse, and a hardcoded 4 is the "equality test against a class ceiling". -->
    <div class="score-btns" id="score-btns"></div>
    <div class="hint" id="hint">does <b>this render</b> work as a wallpaper · keys: <b>1</b>/<b>2</b>/<b>3</b>/<b>4</b> label &amp; advance · <b>←</b>/<b>→</b> move · <b>u</b> next unlabeled</div>
  </div>
  <aside><div class="grid" id="overview"></div></aside>
</main>
<div id="lightbox"><img id="lbimg" alt=""><div class="lbcap" id="lbcap"></div></div>

<script>
// --- which batch to label: ?batch=<dir> query param overrides, else this default
//     (a dir under data/wallpaper_corpus/batches/).
// A COMMA-SEPARATED list loads several batches as consecutive SECTIONS of one sitting
// (?batch=a,b): section order is the order given, each section keeps its own presentation
// order, and every row keeps its own batch — crops resolve per batch and the export writes
// ONE FILE PER BATCH, because `merge_scores --batch` places rows into one images.jsonl and a
// pooled export would hand it keys belonging to a different corpus batch.
const QS=new URLSearchParams(location.search);
const BATCH_IDS=(QS.get('batch')||'2026-07-05_wallpaper_bootstrap_v1')
  .split(',').map(s=>s.trim()).filter(Boolean);
const BATCH_ID=BATCH_IDS[0];
// --- WHICH CORPUS ---------------------------------------------------------
// `?corpus=` names the tree under data/ this sitting labels. Default is the wallpaper
// corpus, so every existing link keeps its exact behaviour; the render-mode (mining)
// corpus passes ?corpus=render_mode_corpus&tiers=3&order=file. The page is a labeling RIG,
// not a wallpaper page — one rig with three knobs beats a 460-line fork per corpus, and the
// addendum makes the pre-labeled sorted sheet the standing default for FUTURE sheets, which
// only means anything if they share this file.
const CORPUS=QS.get('corpus')||'wallpaper_corpus';
// Tier scale: 1..TIERS. The merge refuses anything outside it, so the page must not offer
// a button the corpus cannot hold.
const TIERS=Math.max(2,Math.min(4,parseInt(QS.get('tiers')||'4',10)||4));
const ROOT='../../';                 // tools/viz/ -> repo root
const batchDir=b=>'data/'+CORPUS+'/batches/'+b;
const BATCH_DIR=batchDir(BATCH_ID);
const IMAGES_URL=ROOT+BATCH_DIR+'/images.jsonl';
// localStorage is per-sitting. The wallpaper key is UNSUFFIXED so the in-flight wallpaper
// sitting resumes byte-identically; any other corpus namespaces itself.
const LS_KEY='wallpaper_label::'+(CORPUS==='wallpaper_corpus'?'':CORPUS+'::')+BATCH_IDS.join('+');
const SHUFFLE_SEED=0xC0FFEE;
// --- CORRECTION MODE ------------------------------------------------------
// A pre-labeled sheet (rows carry `suggested_tier`, e.g. the fresh-sheet batch) shows the
// machine's tier PREFILLED and asks the human to fix the ones it got wrong. The invariant
// that does not bend: a SUGGESTION IS NOT A LABEL. `scores` holds only what Matt actually
// decided, and the export writes only `scores`. An unreviewed suggestion never leaves this
// page — a machine tier merged as a human label would poison the corpus silently, and the
// corpus's whole value is that its labels are human.
//
// PRESENTATION ORDER, correction mode: ASCENDING by the head's own continuous readout
// (head_v3.pred = 1 + sum of the CORN marginals), so the sitting runs worst -> best and the
// suggested tiers arrive in blocks: every suggested 1, then every 2, then 3, then 4.
// Requested 2026-08-05, overriding the seeded shuffle below. The shuffle existed to stop the
// head's ranking from anchoring an absolute-tier judgment; sorted, a labeler's threshold
// drifting over the sitting becomes correlated with the predictor those labels will train.
// Kept as a NAMED trade rather than a silent one — flip ORDER_BY back to 'shuffle' to undo.
//
// 'file' is the third option and the one a builder-sorted sheet uses: honor the stamped
// contiguous `sheet_order` and derive NOTHING here. The mining correction sheet
// (prompts/mining_sheet_addendum_sorted.md) is sorted good->best-first in the FILE — on the
// head's continuous score, descending, ties on image_id — so the order is reproducible from
// the artifact and auditable later instead of being a sort this page happens to perform.
// Re-deriving an order in the browser that the builder already stamped is two owners for
// one decision.
const ORDER_BY=QS.get('order')||'pred';   // 'pred' (worst->best) | 'file' | 'shuffle'
// Bumping STORE_V clears a CORRECTION sitting's saved labels on next load (see init) —
// the order changed, so the old partial pass is not resumable in a meaningful sequence.
const STORE_V=2;
let SUGG={};                         // { image_id: 1|2|3|4 } — the machine suggestion
let CORRECTION=false;
let STALE_CLEARED=0;
function suggOf(r){ return SUGG[r.image_id]; }
function predOf(r){
  if(typeof r.pred==='number') return r.pred;                       // flat, mining sheet
  if(r.head_v3 && typeof r.head_v3.pred==='number') return r.head_v3.pred;
  if(r.head_mining_v1 && typeof r.head_mining_v1.pred==='number') return r.head_mining_v1.pred;
  if(typeof r.head_v2_pred==='number') return r.head_v2_pred;
  if(typeof r.p_ge3==='number') return r.p_ge3;
  return 0;
}
function reviewed(r){ return !!scores[r.image_id]; }
function shownTier(r){ return scores[r.image_id] || SUGG[r.image_id]; }
let ROWS=[];                         // presentation-ordered rows {image_id, render, provenance, label}
let cur=0;

// the image_id IS the durable identity; the crop lives in ITS OWN batch's crops/ dir
function keyOf(r){ return r.image_id; }
function batchOf(r){ return r.__batch||BATCH_ID; }
function imgSrc(r){ return ROOT+batchDir(batchOf(r))+'/crops/'+r.image_id+'.jpg'; }
// Stored shape is {__v, ...scores}; a bare {id:n} map is the pre-versioning shape and is
// read as-is (version 1) so the three legacy batches keep resuming.
function loadScores(){
  try{
    const raw=JSON.parse(localStorage.getItem(LS_KEY))||{};
    const {__v, ...s}=raw;
    STORED_V=(typeof __v==='number')?__v:1;
    return s;
  }catch{ STORED_V=STORE_V; return {}; }
}
function saveScores(){ localStorage.setItem(LS_KEY,JSON.stringify({__v:STORE_V,...scores})); }
function clearScores(){ scores={}; localStorage.removeItem(LS_KEY); }
let STORED_V=STORE_V;
let scores=loadScores();             // { image_id: 1|2|3|4 } — HUMAN decisions only

// seeded PRNG (mulberry32) for reproducible presentation order
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// 32-bit string hash (for a per-location shuffle seed)
function strHash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

// The load-bearing bit: this is an ABSOLUTE-tier task, so presentation must NOT
// be ordered by any quality/pref score (that would anchor the judgments). We group
// by location and shuffle render order WITHIN each location deterministically.
// Location = the render geometry (cx/cy/fw + family/c), so id-naming is irrelevant.
function locKey(r){
  const rd=r.render||{};
  return [rd.cx,rd.cy,rd.fw,rd.fractal_type,rd.c_re,rd.c_im].join('|');
}
function buildOrder(rows){
  // Builder-stamped order: honor `sheet_order` exactly and derive nothing. Used by the
  // mining sheet, which is sorted good->bad on the head's continuous score in the FILE.
  // A row with no stamp sorts last rather than silently to position 0, so a half-stamped
  // manifest is visible instead of scrambled.
  if(ORDER_BY==='file'){
    const out=rows.slice().sort((a,b)=>
      ((a.sheet_order??Infinity)-(b.sheet_order??Infinity))||(a.image_id<b.image_id?-1:1));
    out.forEach((r,i)=>{ r.__locstart=(i>0 && suggOf(r)!==suggOf(out[i-1])); });
    return out;
  }
  // Correction sheet: the builder already wrote images.jsonl in a SEEDED SHUFFLE and
  // stamped `sheet_order`, so honor that order rather than re-deriving one here (the
  // shuffle is then reproducible from the file, and the same for every labeler).
  if(CORRECTION && ORDER_BY==='pred'){
    // Worst -> best across EVERY loaded batch: one continuous quality ramp, so the suggested
    // tiers arrive in blocks. Both regimes interleave rather than sitting in two sections —
    // which is the better arrangement for label consistency anyway, since a threshold that
    // drifts over the sitting then drifts across both alike instead of only the second.
    const out=rows.slice().sort((a,b)=>
      (predOf(a)-predOf(b))||(a.image_id<b.image_id?-1:1));
    // The divider now marks where the SUGGESTED TIER changes — the only structural boundary
    // this order actually has, and the one worth seeing coming.
    out.forEach((r,i)=>{ r.__locstart=(i>0 && suggOf(r)!==suggOf(out[i-1])); });
    return out;
  }
  if(CORRECTION){
    // sections in the ?batch= order; inside a section, the builder's stamped seeded shuffle
    const rank=Object.fromEntries(BATCH_IDS.map((b,i)=>[b,i]));
    const out=rows.slice().sort((a,b)=>
      ((rank[batchOf(a)]??99)-(rank[batchOf(b)]??99))||
      ((a.sheet_order??0)-(b.sheet_order??0))||(a.image_id<b.image_id?-1:1));
    out.forEach((r,i)=>{ r.__locstart=(i>0 && batchOf(r)!==batchOf(out[i-1])); });
    return out;
  }
  // Pre-label override: if rows carry a head_v2_pred (a deployed-head quality
  // estimate stamped before labeling), present in DESCENDING predicted order
  // (best first) for labeling speed — the anchoring bias is accepted. This is
  // purely presentation; split/provenance/merge are untouched. Absent the stamp,
  // fall back to the anti-anchoring per-location shuffle below.
  if(rows.length && typeof rows[0].head_v2_pred==='number'){
    const out=rows.slice().sort((a,b)=>(b.head_v2_pred-a.head_v2_pred)||(a.image_id<b.image_id?-1:1));
    out.forEach(r=>{ r.__locstart=false; });
    return out;
  }
  // stable location groups in first-appearance order; renders shuffled inside each.
  const groups=new Map();               // locKey -> rows[]
  for(const r of rows){
    const k=locKey(r);
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(r);
  }
  const out=[];
  for(const [k,grp] of groups){
    // sort inside the group by image_id first for a deterministic base order,
    // then seeded Fisher-Yates keyed by the location so each shuffles independently.
    grp.sort((a,b)=>(a.image_id<b.image_id)?-1:(a.image_id>b.image_id?1:0));
    const rnd=mulberry32(SHUFFLE_SEED ^ strHash(k));
    for(let i=grp.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[grp[i],grp[j]]=[grp[j],grp[i]];}
    grp.forEach((r,idx)=>{ r.__locstart=(idx===0); out.push(r); });
  }
  return out;
}

function parseJsonl(text){
  const rows=[];
  for(const line of text.split(/\r?\n/)){
    const t=line.trim(); if(!t)continue;
    try{ rows.push(JSON.parse(t)); }catch(e){ /* skip bad line */ }
  }
  return rows;
}

function init(rows){
  if(!rows.length){ document.getElementById('loader-msg').textContent='images.jsonl has no rows'; return; }
  // seed local scores from any labels already baked into the file (resume across machines)
  for(const r of rows){ const s=r.label&&r.label.score; if(s&&!scores[r.image_id]) scores[r.image_id]=s; }
  // correction mode iff the batch carries machine suggestions
  CORRECTION=rows.some(r=>typeof r.suggested_tier==='number');
  if(CORRECTION){ for(const r of rows){ if(typeof r.suggested_tier==='number') SUGG[r.image_id]=r.suggested_tier; } }
  // A correction sitting saved under an older STORE_V was labeled in a DIFFERENT order, so
  // resuming it would drop you at an arbitrary point in a sequence that no longer exists.
  // Cleared, and said out loud in the header rather than vanishing silently. Scoped to
  // correction sheets: the three legacy batches keep their saved passes.
  if(CORRECTION && STORED_V!==STORE_V){
    STALE_CLEARED=Object.keys(scores).length;
    clearScores();
  }
  ROWS=buildOrder(rows);
  buildScoreButtons();
  document.title=CORPUS.replace(/_/g,' ')+' label — 1..'+TIERS;
  document.getElementById('page-title').textContent=
    CORPUS==='wallpaper_corpus'?'wallpaper label':CORPUS.replace(/_corpus$/,'').replace(/_/g,' ')+' label';
  document.getElementById('loader').style.display='none';
  document.getElementById('app').style.display='flex';
  const secs=BATCH_IDS.map(b=>`${b} (${rows.filter(r=>batchOf(r)===b).length})`).join(' + ');
  document.getElementById('batch-label').textContent=secs
    +(CORRECTION?' · correction sheet':'')
    +(STALE_CLEARED?` · cleared ${STALE_CLEARED} label(s) from the previous order`:'');
  if(CORRECTION){
    document.getElementById('bulk').style.display='';
    document.getElementById('bulk-below').style.display='';
    document.getElementById('reset').style.display='';
    const keys=tierList().join('</b>/<b>');
    document.getElementById('hint').innerHTML=
      (ORDER_BY==='pred'
        ? 'sorted <b>worst &rarr; best</b> by the head\'s predicted quality &mdash; suggested 1s, then 2s, then 3s, then 4s · '
        : ORDER_BY==='file'
        ? 'sorted <b>best &rarr; worst</b> by the head\'s continuous score (the builder\'s stamped order) &mdash; correct the top carefully, sweep the tail · '
        : '')+
      'each render shows the head\'s <b>suggested</b> tier &mdash; change only where you disagree · '+
      'keys: <b>Enter</b>/<b>space</b> confirm the suggestion · <b>'+keys+'</b> override · '+
      '<b>←</b>/<b>→</b> move · <b>u</b> next unreviewed';
  }
  buildOverview();
  const u=ROWS.findIndex(r=>!scores[keyOf(r)]);
  cur = u<0?0:u;
  show();
}

function buildOverview(){
  const ov=document.getElementById('overview');
  ov.innerHTML='';
  ROWS.forEach((r,i)=>{
    const d=document.createElement('div');
    d.className='cell'+(r.__locstart?' locstart':''); d.dataset.i=i;
    d.innerHTML=`<img loading="lazy" src="${imgSrc(r)}" title="${keyOf(r)}"><span class="tag"></span>`;
    d.onclick=()=>{cur=i;show();};
    ov.appendChild(d);
  });
}

function refreshCell(i){
  const cells=document.getElementById('overview').children;
  const c=cells[i]; if(!c) return;
  const r=ROWS[i], s=scores[keyOf(r)], g=suggOf(r);
  // reviewed -> solid tier color; unreviewed-but-suggested -> dashed, dim (visibly NOT a label)
  const state = s ? (' s'+s) : (g ? (' sug'+g) : '');
  c.className='cell'+(r.__locstart?' locstart':'')+state+(i===cur?' cur':'');
  c.querySelector('.tag').textContent=(s||g||'');
}

function refreshCounts(){
  const n={},TT=tierList(); let changed=0;
  TT.forEach(t=>n[t]=0);
  for(const r of ROWS){
    const s=scores[keyOf(r)];
    if(n[s]!==undefined)n[s]++;
    if(s&&CORRECTION&&suggOf(r)&&s!==suggOf(r))changed++;
  }
  const done=TT.reduce((a,t)=>a+n[t],0);
  document.getElementById('counts').innerHTML=
    `<b>${done}/${ROWS.length}</b> ${CORRECTION?'reviewed':'labeled'} &nbsp; `+
    TT.map(t=>`<span class="${CLS[t]}">${n[t]}·${SHORT[t]}</span>`).join(' / ')+
    (CORRECTION?` &nbsp; <span class="sugg">${changed} corrected</span>`:'');
}

// Tier vocabulary. `TIERS` is the scale's top; a K=3 corpus simply has no tier 4, so every
// per-tier map is sliced by `tierList()` rather than iterated to a hardcoded 4.
const LBL={1:'very bad',2:'okay',3:'good',4:'exceptional'};
const SHORT={1:'bad',2:'okay',3:'good',4:'exc'};
const CLS={1:'bad',2:'mid',3:'good',4:'exc'};
function tierList(){ return Array.from({length:TIERS},(_,i)=>i+1); }
function buildScoreButtons(){
  const box=document.getElementById('score-btns');
  box.innerHTML='';
  tierList().forEach(t=>{
    const b=document.createElement('button');
    b.className='sb'+t; b.dataset.s=String(t);
    b.textContent=`${t} · ${LBL[t]}`;
    b.onclick=()=>setScore(t);
    box.appendChild(b);
  });
}

function show(){
  const r=ROWS[cur], rd=r.render||{}, pv=r.provenance||{};
  document.getElementById('cur-img').src=imgSrc(r);
  document.getElementById('cur-img').alt=keyOf(r);
  document.getElementById('cap-loc').textContent=`${cur+1}/${ROWS.length} · ${r.image_id}`;
  // render_mode is shown because on the mining corpus the MODE is what the human is judging
  // — the same location and palette appear under 15 of them, and "which one is this" is not
  // recoverable from the image for the composite family.
  const mode=(rd.render_mode&&rd.render_mode!=='smooth')?(' · '+rd.render_mode):'';
  document.getElementById('cap-fam').textContent=(rd.fractal_type||pv.family||'')
    +(pv.decoded_class!=null?(' · c'+pv.decoded_class):'')+mode;
  document.getElementById('cap-pal').textContent=rd.palette||'';
  const pm=pv.params||pv.color_params||{};
  const pbits=[];
  if(pm.gamma!=null)pbits.push('γ'+(+pm.gamma).toFixed(2));
  if(pm.phase!=null)pbits.push('φ'+(+pm.phase).toFixed(2));
  if(pm.n_cycles!=null)pbits.push('×'+pm.n_cycles);
  if(pm.reverse)pbits.push('rev');
  document.getElementById('cap-params').textContent=pbits.join(' ');
  // pref-v2 score shown for reference ONLY — presentation is NOT ordered by it.
  const pf=document.getElementById('cap-prefv2'), v=pv.pref_v2_score;
  pf.textContent=(typeof v==='number')?('pref-v2 '+v.toFixed(2)+(pv.score_stratum?(' · '+pv.score_stratum):'')):'';
  pf.style.color='#777';
  // the head's continuous readout (what the presentation order is sorted on) — shown per
  // the ask, and shown for whichever head stamped the row.
  const hf=document.getElementById('cap-headv2');
  const hv=(typeof r.head_v2_pred==='number')?r.head_v2_pred
          :((ORDER_BY==='file'&&typeof r.pred==='number')?r.pred:null);
  hf.textContent=(hv===null)?'':((typeof r.head_v2_pred==='number'?'head-v2 ':'pred ')+hv.toFixed(2));
  hf.style.color='#8a7';
  // correction sheet: the head's own p_ge3 shown beside its suggestion (no hidden rows)
  const g=suggOf(r), gf=document.getElementById('cap-sugg');
  const pg=(typeof r.p_ge3==='number')?r.p_ge3:(r.head_v3&&r.head_v3.p_ge3);
  gf.textContent=g?('suggests '+g+(typeof pg==='number'?(' · p≥3 '+pg.toFixed(2)):'')):'';
  if(lbOpen)syncLightbox();
  const s=scores[keyOf(r)];
  const sc=document.getElementById('cur-score');
  if(s){ sc.textContent='label: '+s+' · '+LBL[s]+(CORRECTION?(s===g?' (confirmed)':' (corrected from '+g+')'):'');
         sc.className='cur-score '+CLS[s]; }
  else if(CORRECTION&&g){ sc.textContent='suggested: '+g+' · '+LBL[g]+' — Enter to confirm, 1-4 to change';
         sc.className='cur-score pending'; }
  else { sc.textContent='unlabeled'; sc.className='cur-score'; }
  document.querySelectorAll('.score-btns button').forEach(b=>
    b.classList.toggle('suggested', CORRECTION && +b.dataset.s===g));
  [...document.getElementById('overview').children].forEach((c,i)=>refreshCell(i));
  document.getElementById('overview').children[cur]?.scrollIntoView({block:'nearest'});
  refreshCounts();
}

function setScore(s){
  scores[keyOf(ROWS[cur])]=s; saveScores();
  refreshCell(cur); refreshCounts();
  if(cur<ROWS.length-1){cur++;show();} else {show();}
}
function move(d){ cur=(cur+d+ROWS.length)%ROWS.length; show(); }
function nextUnscored(){
  for(let k=1;k<=ROWS.length;k++){const i=(cur+k)%ROWS.length; if(!scores[keyOf(ROWS[i])]){cur=i;show();return;}}
}
// Confirm the suggestion AS a human decision — the only way a suggestion becomes a label.
function confirmSuggestion(){
  const g=suggOf(ROWS[cur]);
  if(g) setScore(g);
}
document.getElementById('reset').onclick=()=>{
  const n=Object.keys(scores).length;
  if(!n){ alert('nothing labeled yet'); return; }
  if(!confirm(`Discard all ${n} labels in this sitting and start over?\n\nExport first if you `
    +`want to keep them — this cannot be undone from the page.`)) return;
  clearScores(); cur=0; show();
};
function bulkAccept(rest, what){
  if(!rest.length){ alert('nothing left unreviewed '+what); return; }
  if(!confirm(`Accept the head's suggestion, unchanged, for the ${rest.length} rows `+what
    +`?\n\nThey become YOUR labels in scores.json. Only do this if you have actually read `
    +`the sheet.`)) return;
  rest.forEach(r=>{ scores[r.image_id]=suggOf(r); });
  saveScores(); show();
}
document.getElementById('bulk').onclick=()=>
  bulkAccept(ROWS.filter(r=>!reviewed(r)&&suggOf(r)), 'you have not looked at');
// THE POSITIONAL SWEEP. On a sorted sheet the natural gesture is "everything from here down
// is fine as suggested" — correct the top carefully, sweep the tail. Distinct from
// accept-all-remaining, which also takes unreviewed rows ABOVE the cursor: on a good->bad
// order those are the ones most worth a human look, so sweeping them by accident is exactly
// the mistake this button exists to avoid. Same confirm; the row under the cursor is
// INCLUDED and the confirm says so.
document.getElementById('bulk-below').onclick=()=>
  bulkAccept(ROWS.slice(cur).filter(r=>!reviewed(r)&&suggOf(r)),
             `from row ${cur+1} of ${ROWS.length} down (inclusive)`);

let lbOpen=false;
function syncLightbox(){
  const r=ROWS[cur], rd=r.render||{}, pv=r.provenance||{}, s=scores[keyOf(r)];
  document.getElementById('lbimg').src=imgSrc(r);
  document.getElementById('lbcap').textContent=
    `${cur+1}/${ROWS.length} · ${r.image_id} · ${rd.fractal_type||pv.family||''} · ${rd.palette||''} · `+
    (s?('label '+s+' · '+LBL[s]):(CORRECTION&&suggOf(r)?('suggested '+suggOf(r)+' · '+LBL[suggOf(r)]):'unlabeled'));
}
function openLightbox(){ lbOpen=true; syncLightbox(); document.getElementById('lightbox').style.display='flex'; }
function closeLightbox(){ lbOpen=false; document.getElementById('lightbox').style.display='none'; }
document.getElementById('cur-img').onclick=openLightbox;
document.getElementById('lightbox').onclick=closeLightbox;

window.addEventListener('keydown',e=>{
  if(document.getElementById('app').style.display==='none')return;
  if(e.key==='Escape'){ if(lbOpen)closeLightbox(); return; }
  // 1..TIERS only: on a K=3 corpus, `4` must do NOTHING rather than write a tier the merge
  // will refuse hours later at the end of a sitting.
  if(/^[1-9]$/.test(e.key)&&+e.key<=TIERS){setScore(+e.key);e.preventDefault();}
  else if(CORRECTION&&(e.key==='Enter'||e.key===' ')){confirmSuggestion();e.preventDefault();}
  else if(e.key==='ArrowRight')move(1);
  else if(e.key==='ArrowLeft')move(-1);
  else if(e.key==='u'||e.key==='U')nextUnscored();
});
document.getElementById('next-unscored').onclick=nextUnscored;

document.getElementById('export').onclick=()=>{
  // Export only non-null integer scores, sorted by image_id for stable diffs.
  // In correction mode this is `scores` — HUMAN decisions only. An unreviewed suggestion
  // is deliberately absent: the merge must never see a machine tier as a label.
  // ONE FILE PER BATCH when a sitting spans several: `merge_scores --batch <b>` writes into
  // that batch's images.jsonl, so a pooled file would hand it keys from another batch.
  const owner={};                       // image_id -> batch
  for(const r of ROWS) owner[r.image_id]=batchOf(r);
  const per={}; BATCH_IDS.forEach(b=>per[b]={});
  Object.keys(scores).sort().forEach(k=>{
    if(!scores[k]) return;
    const b=owner[k]; if(b && per[b]) per[b][k]=scores[k];
  });
  const single=BATCH_IDS.length===1;
  BATCH_IDS.forEach(b=>{
    const out=per[b];
    if(!single && !Object.keys(out).length) return;   // nothing reviewed in that section yet
    const blob=new Blob([JSON.stringify(out,null,0)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=single?'scores.json':('scores_'+b+'.json');
    a.click();
    URL.revokeObjectURL(a.href);
  });
};
document.getElementById('load-scores').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{
    scores=JSON.parse(r.result); saveScores();
    [...document.getElementById('overview').children].forEach((c,i)=>refreshCell(i));
    show();
  }catch(err){alert('bad scores.json: '+err);} };
  r.readAsText(f);
};

document.getElementById('load-images').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{init(parseJsonl(r.result));}catch(err){document.getElementById('loader-msg').textContent='parse error: '+err;} };
  r.readAsText(f);
};

document.getElementById('images-url').textContent=
  BATCH_IDS.map(b=>ROOT+batchDir(b)+'/images.jsonl').join('  +  ');
// Load every section. A section that 404s is a LOUD failure, not a short sitting: silently
// labeling one of two batches is how half a sheet goes missing without anyone noticing.
Promise.all(BATCH_IDS.map(b=>
  fetch(ROOT+batchDir(b)+'/images.jsonl')
    .then(r=>{if(!r.ok)throw new Error(b+': HTTP '+r.status);return r.text();})
    .then(t=>parseJsonl(t).map(row=>{row.__batch=b; return row;}))))
  .then(chunks=>init([].concat(...chunks)))
  .catch(err=>{document.getElementById('loader-msg').textContent='auto-load failed ('+err.message+') — use the picker below.';});
</script>
</body></html>
